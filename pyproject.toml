[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dashboard"
version = "0.1.0"
description = "TUI based portfolio management dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  {name = "Connor Proulx", email = "proolux@telus.net"}
]

dependencies = [
  "duckdb>=1.0.0",
  "python-dotenv",
  "yfinance",  
  "requests>=2.32.0",
  "pandas>=2.0.0",
  "pandas-market-calendars>=4.4.0",
  "websocket-client>=1.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
dashboard = "dashboard.cli:main"

[project.urls]
Home-page = "https://github.com/greadee/quaint_dash"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dashboard"]

[tool.coverage.report]
fail_under = 80
show_missing = true


